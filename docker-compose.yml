name: minecraft-server

services:
  papermc:
    image: itzg/minecraft-server:latest
    pull_policy: always
    platform: linux/amd64

    container_name: papermc-server
    hostname: minecraft-server

    ports:
      - "25565:25565/tcp"
      - "25565:25565/udp"
      - "25575:25575/tcp"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"

      MEMORY: "2G"
      JVM_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=50
        -XX:+ParallelRefProcEnabled
        -XX:+AlwaysPreTouch
        -XX:-DisableExplicitGC

      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "minecraft"   # change this

      NOGUI: "true"

    volumes:
      - ./data:/data
      - ./logs:/data/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "rcon-cli", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    pids_limit: 2048

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

    stdin_open: true
    tty: true

    networks:
      minecraft-net:
        ipv4_address: 172.28.0.2

networks:
  minecraft-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
